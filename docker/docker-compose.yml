services:
  cabestan:
    image: cabestan
    restart: always
    build:
      context: ../app
      dockerfile: ../docker/cabestan/cabestan_dockerfile
      args:
        - CABESTAN_ENV=${CABESTAN_ENV}
        - USER_ID=${USER_ID}
        - GROUP_ID=${GROUP_ID}
        - DJANGO_HTTP_PORT=${DJANGO_HTTP_PORT}
    environment:
      - CABESTAN_ENV=${CABESTAN_ENV}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - WORK_DIR=/home/cabestan/
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - SECRET_KEY=${SECRET_KEY}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}
    volumes:
      - ../app:/home/cabestan/app/
    ports:
      - ${DJANGO_HTTP_PORT}:8080
      - ${DJANGO_HTTPS_PORT}:8443
    depends_on:
      db_pg:
        condition: service_healthy
    container_name: ${COMPOSE_PROJECT_NAME}_web

  redis:
    image: redis
    restart: always
    container_name: ${COMPOSE_PROJECT_NAME}_redis

  db_pg:
    build:
      context: .
      dockerfile: postgres/pg_dockerfile
    restart: always
    container_name: ${COMPOSE_PROJECT_NAME}_db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    shm_size: 1g
    volumes:
      - ${VOLUME_PGDATA}:/var/lib/postgresql/data/ # persist data even if container shuts down
    ports:
      - ${DB_PORT}:5432
    healthcheck:
      test: pg_isready -U ${DB_USER} -d ${DB_NAME}
      interval: 10s
      timeout: 3s
      start_period: 3s
      retries: 3

  nginx:
    build:
      context: .
      dockerfile: nginx/nginx_dockerfile
    ports:
      - "80:80"
    depends_on:
      - cabestan
    restart: always
    environment:
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DJANGO_HTTP_PORT=${DJANGO_HTTP_PORT}
      - HOST=${HOST}
    volumes:
      - ./nginx/cabestan.conf.model:/cabestan.conf.template
    container_name: ${COMPOSE_PROJECT_NAME}_nginx

  client:
    build:
      context: ../client
      dockerfile: ../docker/client/client_dockerfile
    ports:
      - "${CLIENT_HTTP_PORT}:5173"
    restart: no
    volumes:
      - ../client:/app
      - /app/node_modules/
    environment:
      - VITE_API_PROTOCOL=http
      - VITE_API_HOST=${HOST}
      - VITE_API_PATH=/api/rest
      - VITE_CACHE_TTL=1000
    container_name: ${COMPOSE_PROJECT_NAME}_client

  wiremock:
    image: "wiremock/wiremock:latest"
    volumes:
      - ./wiremock/extensions:/var/wiremock/extensions
      - ./wiremock/__files:/home/wiremock/__files
      - ./wiremock/mappings:/home/wiremock/mappings
    command: ["--port=8082"]
    entrypoint:
      [
        "/docker-entrypoint.sh",
        "--global-response-templating",
        "--disable-gzip",
        "--verbose",
        "--enable-stub-cors",
      ]
    ports:
      - "8082:8082"
    container_name: ${COMPOSE_PROJECT_NAME}_wiremock
